name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -q \
            requests ruff==0.16.3 vulture==2.16 radon==6.0.1 bandit==1.9.4
          npm install -g pyright@1.1.413
      - name: Python compile
        run: python -c "import pathlib, py_compile; [py_compile.compile(str(path), doraise=True) for directory in ('src', 'scripts', 'tests') for path in pathlib.Path(directory).glob('*.py')]"
      - name: Embedded JavaScript syntax
        shell: bash
        run: |
          python scripts/check_embedded_js.py > embedded-ui.js
          node --check embedded-ui.js
      - name: Interface behaviour tests
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Pyright
        run: pyright --project pyrightconfig.json
      - name: Ruff
        run: ruff check .
      - name: Dead code
        run: vulture src/search_engine.py --min-confidence 80
      - name: Security audit
        run: bandit -q -r src/search_engine.py
      - name: Complexity regression
        shell: bash
        run: |
          report="$(radon cc src/search_engine.py -n D)"
          test -z "$report" || { printf '%s\n' "$report"; exit 1; }
      - name: Windows IPC smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/windows_ipc_smoke.py
