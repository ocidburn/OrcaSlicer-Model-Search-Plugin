<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-labelledby="cr-title cr-desc">
  <title id="cr-title">Chrome developer tools: the Application panel showing cookies for a portal</title>
  <desc id="cr-desc">A schematic of the Chrome Application panel. Step 1 marks the Application tab in the tool strip. Step 2 marks the portal address listed under Cookies in the left sidebar. Step 3 marks a cookie row in the table on the right, whose value is shown in the preview pane below and copied from there.</desc>

  <style>
    .frame { fill: #ffffff; stroke: #b9c0c8; stroke-width: 1.5; }
    .bar   { fill: #f2f4f7; }
    .divider { stroke: #d7dce2; stroke-width: 1; }
    .t     { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #1d2430; }
    .lbl   { font-size: 13px; }
    .head  { font-size: 12.5px; fill: #45505d; font-weight: 600; }
    .mono  { font-family: "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace; font-size: 12.5px; fill: #1d2430; }
    .tab-on { fill: #e3edfb; stroke: #2f6fd0; stroke-width: 1.5; }
    .row-on { fill: #fff5d6; stroke: #d9a300; stroke-width: 1.5; }
    .pin   { fill: #d64545; }
    .pin-t { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #ffffff; }
    .cap   { font-family: "Segoe UI", Arial, sans-serif; font-size: 12.5px; fill: #d64545; font-weight: 600; }
    .note  { font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; fill: #5a6673; }
  </style>

  <text class="t" x="0" y="14" style="font-size:14px;font-weight:700">Chrome / Edge &#8212; Application panel <tspan class="note">(schematic, not a screenshot)</tspan></text>

  <rect class="frame" x="0" y="26" width="590" height="330" rx="6"/>

  <!-- tool strip -->
  <rect class="bar" x="1" y="27" width="588" height="30" rx="5"/>
  <line class="divider" x1="1" y1="57" x2="589" y2="57"/>
  <text class="t lbl" x="16"  y="47">Elements</text>
  <text class="t lbl" x="82"  y="47">Console</text>
  <text class="t lbl" x="146" y="47">Sources</text>
  <text class="t lbl" x="208" y="47">Network</text>
  <rect class="tab-on" x="272" y="31" width="86" height="22" rx="4"/>
  <text class="t lbl" x="280" y="47" style="font-weight:700">Application</text>
  <text class="t lbl" x="374" y="47">Security</text>

  <!-- sidebar -->
  <line class="divider" x1="210" y1="57" x2="210" y2="355"/>
  <text class="t head"  x="16" y="78">Storage</text>
  <text class="t lbl"   x="16" y="102">&#9656; Local storage</text>
  <text class="t lbl"   x="16" y="126">&#9656; Session storage</text>
  <text class="t lbl"   x="16" y="150" style="font-weight:700">&#9662; Cookies</text>
  <rect class="row-on" x="26" y="158" width="172" height="22" rx="4"/>
  <text class="mono"    x="34" y="174">https://cults3d.com</text>
  <text class="t lbl"   x="16" y="204">&#9656; IndexedDB</text>
  <text class="t lbl"   x="16" y="228">&#9656; Cache storage</text>

  <!-- table -->
  <text class="t head" x="226" y="78">Name</text>
  <text class="t head" x="376" y="78">Value</text>
  <line class="divider" x1="222" y1="86" x2="578" y2="86"/>

  <text class="mono" x="226" y="108">_cults3d_session</text>
  <text class="mono" x="376" y="108">s%3AhQ7v…9fA</text>
  <line class="divider" x1="222" y1="118" x2="578" y2="118"/>

  <rect class="row-on" x="222" y="122" width="356" height="26" rx="4"/>
  <text class="mono" x="226" y="140" style="font-weight:700">cf_clearance</text>
  <text class="mono" x="376" y="140" style="font-weight:700">Xk2p…q1Z</text>
  <line class="divider" x1="222" y1="152" x2="578" y2="152"/>

  <text class="mono" x="226" y="174">locale</text>
  <text class="mono" x="376" y="174">en</text>
  <line class="divider" x1="222" y1="184" x2="578" y2="184"/>

  <!-- value preview pane -->
  <line class="divider" x1="222" y1="206" x2="578" y2="206"/>
  <text class="t head" x="226" y="226">Cookie Value</text>
  <rect class="row-on" x="222" y="234" width="356" height="38" rx="4"/>
  <text class="mono" x="230" y="250">Xk2pR8s1TnQ4vB0mLd7Y…</text>
  <text class="mono" x="230" y="266">…jH3wZq1Z</text>
  <text class="note" x="222" y="292">select the text here, or right-click the row &#8250; Copy value</text>

  <!-- pins -->
  <circle class="pin" cx="316" cy="24" r="11"/><text class="pin-t" x="312" y="28">1</text>
  <circle class="pin" cx="14"  cy="169" r="11"/><text class="pin-t" x="10"  y="173">2</text>
  <circle class="pin" cx="212" cy="135" r="11"/><text class="pin-t" x="208" y="139">3</text>

  <!-- captions -->
  <text class="cap" x="612" y="46">1</text>
  <text class="note" x="626" y="46">Open the</text>
  <text class="note" x="626" y="62">Application tab</text>

  <text class="cap" x="612" y="174">2</text>
  <text class="note" x="626" y="174">Pick the portal</text>
  <text class="note" x="626" y="190">under Cookies</text>

  <text class="cap" x="612" y="252">3</text>
  <text class="note" x="626" y="252">Click the row;</text>
  <text class="note" x="626" y="268">the full value</text>
  <text class="note" x="626" y="284">appears below</text>

  <text class="note" x="0" y="382">Open with F12, or Menu &#8250; More tools &#8250; Developer tools.</text>
  <text class="note" x="0" y="400">Application may sit behind the &#187; overflow button when the window is narrow.</text>
  <text class="note" x="0" y="418">The table truncates long values &#8212; take the text from the pane below, not from the Value column.</text>
</svg>
